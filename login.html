<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TelQ</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[linear-gradient(180deg,#FF7D00_0%,#FFA600_100%)] font-sans flex flex-col items-center justify-center min-h-screen p-4">

    <!-- Logo -->
    

    <!-- Login Box -->
    <div class="bg-white p-8 rounded-xl border border-gray-200 shadow-md w-full max-w-md">
        <div class="text-center">
            <h2 class="text-3xl font-bold text-gray-900">Welcome back!</h2>
            <p class="mt-2 text-sm text-gray-600">Please fill in your Email and Password to Sign In.</p>
        </div>
        <form class="mt-8 space-y-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1" for="email">Email Address</label>
                <input
                  type="email"
                  id="email"
                  placeholder="Your Email Address"
                  class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-brand-orange focus:border-brand-orange"
                />
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1" for="password">Password</label>
                <input
                  type="password"
                  id="password"
                  placeholder="Password"
                  class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-brand-orange focus:border-brand-orange"
                />
            </div>
            <button type="submit" class="w-full bg-[#FF7D00] hover:bg-gray-600 text-white font-bold py-2 px-4 rounded-md transition duration-300">
                Log-in
            </button>
        </form>
        <div class="mt-6 text-center">
            <p class="text-sm text-gray-600">
                Don’t have an account?
                <a href="#" class="text-[#FF7D00] font-medium hover:text-gray-600">Create here!</a>
            </p>
        </div>
    </div>

</body>
</html>
