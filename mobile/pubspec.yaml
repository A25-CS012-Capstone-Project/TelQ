name: telQ_mobile
description: "Ini adalah aplikasi mobile untuk TelQ"

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  equatable: ^2.0.5
  flutter_bloc: ^9.0.0
  extended_image: ^9.0.7
  get_it: ^8.0.2
  http: ^1.2.0
  shared_preferences: ^2.3.3
  google_fonts: ^6.1.0
  intl: ^0.20.1
  d_method: ^0.2.1
  grouped_list: ^6.0.0
  mocktail: ^1.0.1
  bloc_test: ^10.0.0
  lottie: ^2.6.0
  smooth_page_indicator: ^1.1.0
  flutter_local_notifications: ^19.0.0
  geolocator: ^13.0.0
  geolocator_android: 4.6.1 
  liquid_glass_easy: ^1.0.0
  quickalert: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  mockito: ^5.4.2
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
