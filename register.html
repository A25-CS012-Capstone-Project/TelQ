<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buat Akun - TelQ</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[linear-gradient(180deg,#FF7D00_0%,#FFA600_100%)] font-sans">

    <div class="flex items-center justify-center min-h-screen px-4">
        <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
            
            <!-- Header -->
            <div class="text-center mb-8">
                
                <h1 class="text-2xl font-bold text-gray-800 mt-4">Create an account</h1>
            </div>

            <!-- Form -->
            <form action="#" method="POST">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                    <div>
                        <label for="first-name" class="block text-sm font-medium text-gray-700">First Name</label>
                        <input type="text" id="first-name" name="first-name" placeholder="First Name" required
                               class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-[#FF7D00] focus:border-[#FF7D00]">
                    </div>
                    <div>
                        <label for="last-name" class="block text-sm font-medium text-gray-700">Last Name</label>
                        <input type="text" id="last-name" name="last-name" placeholder="Last Name" required
                               class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-[#FF7D00] focus:border-[#FF7D00]">
                    </div>
                </div>

                <div class="mb-4">
                    <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
                    <input type="email" id="email" name="email" placeholder="Email" required
                           class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-[#FF7D00] focus:border-[#FF7D00]">
                </div>

                <div class="mb-4">
                    <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                    <input type="password" id="password" name="password" placeholder="Password" required
                           class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-[#FF7D00] focus:border-[#FF7D00]">
                </div>

                <div class="mb-6">
                    <label for="phone-number" class="block text-sm font-medium text-gray-700">Phone Number</label>
                    <input type="tel" id="phone-number" name="phone-number" placeholder="Phone Number" required
                           class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-[#FF7D00] focus:border-[#FF7D00]">
                </div>

                <div class="flex items-center mb-6">
                    <input id="terms" name="terms" type="checkbox" required
                           class="h-4 w-4 text-[#FF7D00] border-gray-300 rounded focus:ring-[#FF7D00]">
                    <label for="terms" class="ml-2 block text-sm text-gray-900">
                        I agree to the <a href="#" class="font-medium text-[#FF7D00] hover:text-gray-600">Term & Condition</a>
                    </label>
                </div>

                <div>
                    <button type="submit" class="inline-block font-bold rounded-lg transition duration-300 bg-[#FF7D00] text-white hover:bg-gray-600 w-full py-3">
                        Create
                    </button>
                </div>
            </form>

            <!-- Footer Link -->
            <p class="mt-8 text-center text-sm text-gray-600">
                Already have an account? <a href="#" class="font-medium text-[#FF7D00] hover:text-gray-600">Login here!</a>
            </p>
        </div>
    </div>

</body>
</html>
