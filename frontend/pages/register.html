<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TelQ - Register</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        primary: '#FF7D00',
                        secondary: '#FFA600',
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --phi: 1.618;
            --font-base: 1rem;
        }

        body {
            font-size: 15px;
            line-height: 1.618;
        }

        @media (min-width: 768px) {
            body {
                font-size: 16px;
            }
        }

        .auth-title-main {
            font-size: clamp(2rem, 1.6rem + 0.8vw, 2.5rem);
            line-height: 1.2;
        }

        .auth-label {
            font-size: calc(var(--font-base) * 1.02);
            line-height: 1.4;
        }

        .auth-input {
            font-size: var(--font-base);
            line-height: 1.4;
        }

        .auth-checkbox-label {
            font-size: calc(var(--font-base) * 0.98);
            line-height: 1.5;
        }

        .auth-button {
            font-size: calc(var(--font-base) * 1.05);
            line-height: 1.3;
        }

        .auth-extra {
            font-size: calc(var(--font-base) * 0.98);
            line-height: 1.5;
        }
    </style>
</head>

<body class="font-sans bg-gray-50 min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-xl bg-white rounded-2xl shadow-[0_18px_40px_rgba(0,0,0,0.12)] px-8 py-8">
        <!-- Header -->
        <div class="mb-6 text-center">
            <h1 class="auth-title-main font-bold text-gray-800">Create an account</h1>
        </div>

        <!-- Form -->
        <form action="#" method="POST" onsubmit="handleRegister(event)">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label for="firstname" class="auth-label block font-light text-gray-700">First Name</label>
                    <input type="text" id="firstname" name="firstname" placeholder="First Name" required
                        class="auth-input bg-[#F5F5F5] mt-1 block w-full px-4 py-3 border rounded-lg shadow-sm placeholder-gray-400 focus:outline-none focus:ring-primary focus:border-primary">
                </div>
                <div>
                    <label for="lastname" class="auth-label block font-light text-gray-700">Last Name</label>
                    <input type="text" id="lastname" name="lastname" placeholder="Last Name" required
                        class="auth-input bg-[#F5F5F5] mt-1 block w-full px-4 py-3 border rounded-lg shadow-sm placeholder-gray-400 focus:outline-none focus:ring-primary focus:border-primary">
                </div>
            </div>

            <div class="mb-4">
                <label for="email" class="auth-label block font-light text-gray-700">Email</label>
                <input type="email" id="email" name="email" placeholder="Email" required
                    class="auth-input bg-[#F5F5F5] mt-1 block w-full px-4 py-3 border rounded-lg shadow-sm placeholder-gray-400 focus:outline-none focus:ring-primary focus:border-primary">
            </div>

            <div class="mb-4">
                <label for="password" class="auth-label block font-light text-gray-700">Password</label>
                <input type="password" id="password" name="password" placeholder="Password" required
                    class="auth-input bg-[#F5F5F5] mt-1 block w-full px-4 py-3 border rounded-lg shadow-sm placeholder-gray-400 focus:outline-none focus:ring-primary focus:border-primary">
            </div>

            <div class="mb-6">
                <label for="customer_id" class="auth-label block font-light text-gray-700">Customer ID (unik)</label>
                <input type="tel" id="customer_id" name="customer_id" placeholder="Contoh: CUST-001" required
                    class="auth-input bg-[#F5F5F5] mt-1 block w-full px-4 py-3 border rounded-lg shadow-sm placeholder-gray-400 focus:outline-none focus:ring-primary focus:border-primary">
            </div>

            <div class="flex items-center mb-6">
                <input id="terms" name="terms" type="checkbox" required
                    class="h-5 w-5 text-primary border-gray-300 rounded-md focus:ring-primary">
                <label for="terms" class="auth-checkbox-label ml-3 text-gray-900">
                    I agree to the <a href="#" class="font-medium text-primary hover:text-gray-700">Term &amp;
                        Condition</a>
                </label>
            </div>

            <button type="submit"
                class="auth-button w-full bg-primary hover:bg-gray-700 text-white font-semibold py-3 rounded-lg transition duration-300">
                Create
            </button>
        </form>

        <!-- Footer Link -->
        <p class="auth-extra mt-6 pt-4 border-t border-gray-200 text-center text-gray-600">
            Already have an account?
            <a href="/login" class="font-medium text-primary hover:text-gray-700">Login here!</a>
        </p>
    </div>

    <script src="/assets/js/auth.js"></script>
</body>

</html>
