<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TelQ - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        primary: '#FF7D00',
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --phi: 1.618;
            --font-base: 1rem;
        }

        body {
            font-size: 15px;
            line-height: 1.618;
        }

        @media (min-width: 768px) {
            body {
                font-size: 16px;
            }
        }

        .auth-title-main {
            font-size: clamp(2rem, 1.6rem + 0.8vw, 2.5rem);
            line-height: 1.2;
        }

        .auth-title-sub {
            font-size: clamp(1.1rem, 0.95rem + 0.4vw, 1.4rem);
            line-height: 1.25;
            letter-spacing: 0.14em;
        }

        .auth-label {
            font-size: calc(var(--font-base) * 1.02);
            line-height: 1.4;
        }

        .auth-input {
            font-size: var(--font-base);
            line-height: 1.4;
        }

        .auth-button {
            font-size: calc(var(--font-base) * 1.05);
            line-height: 1.3;
        }

        .auth-extra {
            font-size: calc(var(--font-base) * 0.98);
            line-height: 1.5;
        }
    </style>
</head>

<body class="font-sans bg-gray-50 min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-[0_18px_40px_rgba(0,0,0,0.12)] px-8 py-8">
        <div class="mb-6 text-center">
            <h1 class="auth-title-main font-bold text-gray-900">Welcome to TelQ</h1>
            <p class="auth-title-sub font-semibold text-primary mt-1">USER LOGIN</p>
        </div>

        <form class="space-y-5" onsubmit="handleLogin(event)">
            <div>
                <label for="email" class="auth-label block font-light mb-1.5 text-gray-800">Email</label>
                <input type="email" id="email" placeholder="Email"
                    class="auth-input w-full bg-[#F5F5F5] px-3 py-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary" />
            </div>

            <div>
                <label for="password" class="auth-label block font-light mb-1.5 text-gray-800">Password</label>
                <input type="password" id="password" placeholder="Password"
                    class="auth-input w-full bg-[#F5F5F5] px-3 py-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary" />
            </div>

            <button type="submit"
                class="auth-button mt-2 w-full bg-primary hover:bg-gray-700 text-white font-semibold py-3 rounded-lg transition duration-300">
                Login
            </button>
        </form>

        <p class="auth-extra mt-6 pt-4 border-t border-gray-200 text-center text-gray-600">
            Don't have an account?
            <a href="/register" class="text-primary font-semibold hover:text-gray-700">Create here!</a>
        </p>
    </div>

    <script src="/assets/js/auth.js"></script>
</body>

</html>
